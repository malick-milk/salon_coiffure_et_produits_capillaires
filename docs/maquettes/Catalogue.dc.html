<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Boutique — catalogue</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0F0F}
a{color:#F8F8F8;text-decoration:none}a:hover{color:#D4AF37}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #F8F8F8; background: #0F0F0F; min-height: 100vh;">

<header style="border-bottom: 1px solid #262626; padding: 0 24px;">
<div style="max-width: 1280px; margin: 0 auto; min-height: 80px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;">
<a href="Accueil.dc.html" aria-label="Accueil" style="display: flex; align-items: center; justify-content: center; width: 160px; height: 48px; border: 1px dashed #D4AF37; border-radius: 8px; color: #D4AF37; font-size: 12px; letter-spacing: 0.14em;">[LOGO]</a>
<nav aria-label="Navigation principale" style="display: flex; flex-wrap: wrap; gap: 32px; font-size: 15px; font-weight: 500;">
<a href="Catalogue.dc.html" aria-current="page" style="color: #D4AF37;">Boutique</a>
<a href="Accueil.dc.html">Prestations</a>
<a href="Reservation.dc.html">Réserver</a>
<a href="Accueil.dc.html">Contact</a>
</nav>
<div style="display: flex; gap: 8px;">
<a href="Compte.dc.html" aria-label="Mon compte" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg></a>
<a href="#" aria-label="Panier, 2 articles" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg></a>
</div>
</div>
</header>

<main style="padding: 40px 24px 96px;">
<div style="max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px;">

<nav aria-label="Fil d'Ariane" style="font-size: 14px; color: #A3A3A3; display: flex; gap: 8px; align-items: center;"><a href="Accueil.dc.html" style="color: #A3A3A3;">Accueil</a><span aria-hidden="true">/</span><span style="color: #F8F8F8;">Boutique</span></nav>

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 20px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 48px; font-weight: 600;">Boutique</h1>
<p style="margin: 0; color: #BDBDBD; font-size: 16px;">9 produits Dabo Hair</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: end;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="cat-search" style="font-size: 13px; color: #BDBDBD;">Rechercher</label>
<div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: 999px; border: 1px solid #3A3A3A; background: #1A1A1A; width: 300px; box-sizing: border-box;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input id="cat-search" type="search" placeholder="Sérum, spray, crème…" style="border: none; outline: none; background: transparent; color: #F8F8F8; font: 400 15px Inter, sans-serif; flex-grow: 1; min-width: 0;"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="cat-sort" style="font-size: 13px; color: #BDBDBD;">Trier par</label>
<select id="cat-sort" style="min-height: 48px; padding: 0 16px; border-radius: 999px; border: 1px solid #3A3A3A; background: #1A1A1A; color: #F8F8F8; font: 400 15px Inter, sans-serif;"><option>Nouveautés</option><option>Prix croissant</option><option>Prix décroissant</option><option>Meilleures ventes</option></select>
</div>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
<span style="font-size: 14px; color: #BDBDBD;">Filtres actifs :</span>
<button type="button" aria-label="Retirer le filtre Dabo Hair" style="display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D4AF37; background: #17140B; color: #D4AF37; font: 500 14px Inter, sans-serif;">Dabo Hair<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
<button type="button" aria-label="Retirer le filtre Cheveux crépus" style="display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D4AF37; background: #17140B; color: #D4AF37; font: 500 14px Inter, sans-serif;">Cheveux crépus<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
<button type="button" style="min-height: 36px; padding: 0 8px; border: none; background: transparent; color: #F8F8F8; font: 500 14px Inter, sans-serif; text-decoration: underline; text-underline-offset: 4px;">Tout effacer</button>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start;">
<aside aria-label="Filtres" style="flex: 1 1 260px; max-width: 300px; display: flex; flex-direction: column; gap: 28px; background: #1A1A1A; border: 1px solid #262626; border-radius: 16px; padding: 24px; box-sizing: border-box;">
<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px;">
<legend style="font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #D4AF37; font-weight: 600; margin-bottom: 12px;">Catégories</legend>
<sc-for list="{{categories}}" as="c" hint-placeholder-count="4">
<label style="display: flex; align-items: center; gap: 10px; font-size: 15px; min-height: 32px; padding-left: {{c.indent}};"><input type="checkbox" checked="{{c.checked}}" style="width: 18px; height: 18px; accent-color: #D4AF37;">{{c.name}}<span style="margin-left: auto; color: #A3A3A3; font-size: 13px;">{{c.count}}</span></label>
</sc-for>
</fieldset>
<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px;">
<legend style="font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #D4AF37; font-weight: 600; margin-bottom: 12px;">Type de cheveux</legend>
<label style="display: flex; align-items: center; gap: 10px; font-size: 15px; min-height: 32px;"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #D4AF37;">Crépus</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 15px; min-height: 32px;"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #D4AF37;">Bouclés</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 15px; min-height: 32px;"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #D4AF37;">Lisses</label>
</fieldset>
<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px;">
<legend style="font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #D4AF37; font-weight: 600; margin-bottom: 12px;">Prix (F CFA)</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #BDBDBD;">Min<input type="number" value="0" style="min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid #3A3A3A; background: #0F0F0F; color: #F8F8F8; font: 400 15px Inter, sans-serif; width: 100%; box-sizing: border-box;"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #BDBDBD;">Max<input type="number" value="10000" style="min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid #3A3A3A; background: #0F0F0F; color: #F8F8F8; font: 400 15px Inter, sans-serif; width: 100%; box-sizing: border-box;"></label>
</div>
</fieldset>
<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px;">
<legend style="font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #D4AF37; font-weight: 600; margin-bottom: 12px;">Disponibilité</legend>
<label style="display: flex; align-items: center; gap: 10px; font-size: 15px; min-height: 32px;"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #D4AF37;">En stock uniquement</label>
</fieldset>
<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px;">
<legend style="font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #D4AF37; font-weight: 600; margin-bottom: 12px;">Marques</legend>
<label style="display: flex; align-items: center; gap: 10px; font-size: 15px; min-height: 32px;"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #D4AF37;">Dabo Hair</label>
</fieldset>
</aside>

<section aria-label="Résultats" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 32px;">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px;">
<sc-for list="{{products}}" as="p" hint-placeholder-count="6">
<article style="background: #1A1A1A; border: 1px solid #262626; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;">
<a href="Produit.dc.html" style="position: relative; aspect-ratio: 4 / 5; background: #232323; display: flex; align-items: center; justify-content: center; color: #8A8A8A; font-size: 12px; letter-spacing: 0.12em;">[PHOTO PRODUIT]<sc-if value="{{p.badge}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 999px; background: {{p.badgeBg}}; color: {{p.badgeFg}}; font-size: 12px; font-weight: 600; letter-spacing: 0;">{{p.badge}}</span></sc-if></a>
<div style="padding: 18px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1;">
<span style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #D4AF37;">{{p.brand}}</span>
<a href="Produit.dc.html" style="font-family: 'Playfair Display', Georgia, serif; font-size: 19px; line-height: 1.3;">{{p.name}}</a>
<span style="font-size: 13px; color: #BDBDBD;">{{p.meta}}</span>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px;">
<strong style="font-size: 18px;">{{p.price}}</strong>
<button type="button" aria-label="Ajouter au panier" disabled="{{p.soldOut}}" style="width: 44px; height: 44px; border-radius: 999px; border: none; background: {{p.btnBg}}; color: {{p.btnFg}}; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
</div>
</div>
</article>
</sc-for>
</div>
<nav aria-label="Pagination" style="display: flex; justify-content: center; gap: 8px;">
<a href="#" aria-current="page" style="width: 44px; height: 44px; border-radius: 999px; background: #D4AF37; color: #0F0F0F; display: flex; align-items: center; justify-content: center; font-weight: 600;">1</a>
<a href="#" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #3A3A3A; display: flex; align-items: center; justify-content: center;">2</a>
<a href="#" aria-label="Page suivante" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #3A3A3A; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
</nav>
</section>
</div>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1800}}'>
class Component extends DCLogic {
  renderVals() {
    const card = (p) => ({
      ...p,
      soldOut: !!p.soldOut,
      btnBg: p.soldOut ? '#2A2A2A' : '#D4AF37',
      btnFg: p.soldOut ? '#6B6B6B' : '#0F0F0F'
    });
    return {
      categories: [
        { name: 'Soins capillaires', count: 9, checked: false, indent: '0px' },
        { name: 'Sérums', count: 3, checked: false, indent: '20px' },
        { name: 'Hydratants et crèmes', count: 3, checked: false, indent: '20px' },
        { name: 'Soins traitants', count: 2, checked: false, indent: '20px' },
        { name: 'Shampoings', count: 1, checked: false, indent: '20px' }
      ],
      products: [
        card({ brand: 'Dabo Hair', name: 'Sérum Activ’Pousse', meta: '30 ml · existe en 15 ml', price: '3 000 F CFA', badge: 'Produit phare', badgeBg: '#D4AF37', badgeFg: '#0F0F0F' }),
        card({ brand: 'Dabo Hair', name: 'Sérum Activ’Pousse', meta: '15 ml · format découverte', price: '1 500 F CFA', badge: '' }),
        card({ brand: 'Dabo Hair', name: 'Sérum Booster', meta: '30 ml · En stock', price: '3 000 F CFA', badge: '' }),
        card({ brand: 'Dabo Hair', name: 'Spray hydratant', meta: '250 ml · En stock', price: '5 000 F CFA', badge: 'Produit phare', badgeBg: '#D4AF37', badgeFg: '#0F0F0F' }),
        card({ brand: 'Dabo Hair', name: 'Hydratant', meta: '100 ml · En stock', price: '2 500 F CFA', badge: '' }),
        card({ brand: 'Dabo Hair', name: 'Crème capillaire', meta: 'En stock', price: '3 000 F CFA', badge: 'Produit phare', badgeBg: '#D4AF37', badgeFg: '#0F0F0F' }),
        card({ brand: 'Dabo Hair', name: 'Spray anti-chute', meta: 'Plus que 4 en stock', price: '5 000 F CFA', badge: 'Stock limité', badgeBg: '#FFF4D6', badgeFg: '#7A5A00' }),
        card({ brand: 'Dabo Hair', name: 'Masque capillaire', meta: 'Rupture de stock (exemple d’état)', price: '3 000 F CFA', badge: 'Rupture', badgeBg: '#E4E4E7', badgeFg: '#3F3F46', soldOut: true }),
        card({ brand: 'Dabo Hair', name: 'Shampooing', meta: 'En stock', price: '3 000 F CFA', badge: 'Produit phare', badgeBg: '#D4AF37', badgeFg: '#0F0F0F' })
      ]
    };
  }
}
</script>
</body>
</html>
